[package]
name = "nsh-app-nsh"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-node-compat-rs = { path = "../../packages/nsh-node-compat/rust" }
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "sync", "time", "io-util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "gzip", "deflate", "json"] }
x25519-dalek = "=3.0.0"
chacha20 = "=0.10.2"
salsa20 = "=0.11.0"
rc4 = "=0.2.0"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
getrandom = "0.4"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
libc = "0.2"
tar = "0.4"
flate2 = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
objc2-ui-kit = { version = "=0.3.2", features = ["UIView"] }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFCGTypes"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false, features = ["bundle"] }
tempfile = "3"
# Match the fixed NSH checkout's Cargo.lock. Mixing Rolldown 1.2.13 with
# newly published internal 1.3 crates breaks its preserve-modules API.
rolldown_std_utils = "=1.2.13"
rolldown_fs = "=1.2.13"
rolldown_tracing = "=1.2.13"
rolldown_devtools = "=1.2.13"
rolldown_devtools_action = "=1.2.13"

[build-dependencies]
cc = "1"
