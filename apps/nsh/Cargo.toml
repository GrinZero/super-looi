[package]
name = "nsh-app-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
nsh-node-compat-rs = { path = "../../packages/nsh-node-compat/rust" }

[dev-dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false, features = ["bundle"] }
tempfile = "3"
# Match the fixed NSH checkout's Cargo.lock. Mixing Rolldown 1.2.13 with
# newly published internal 1.3 crates breaks its preserve-modules API.
rolldown_std_utils = "=1.2.13"
rolldown_fs = "=1.2.13"
rolldown_tracing = "=1.2.13"
rolldown_devtools = "=1.2.13"
rolldown_devtools_action = "=1.2.13"
